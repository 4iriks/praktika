name: pyanswer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-ingestion-environment: &ingestion-environment
  STACK_EXCHANGE_SITE: ${STACK_EXCHANGE_SITE:-ru.stackoverflow}
  STACK_EXCHANGE_TAG: ${STACK_EXCHANGE_TAG:-python}
  STACK_EXCHANGE_TARGET_DOCUMENTS: ${STACK_EXCHANGE_TARGET_DOCUMENTS:-25000}
  STACKEXCHANGE_API_BASE_URL: ${STACKEXCHANGE_API_BASE_URL:-https://api.stackexchange.com/2.3}
  STACKEXCHANGE_KEY: ${STACKEXCHANGE_KEY:-}
  STACKEXCHANGE_QUESTION_FILTER: ${STACKEXCHANGE_QUESTION_FILTER:-withbody}
  STACKEXCHANGE_ANSWER_FILTER: ${STACKEXCHANGE_ANSWER_FILTER:-withbody}
  STACKEXCHANGE_PAGE_SIZE: ${STACKEXCHANGE_PAGE_SIZE:-100}
  STACKEXCHANGE_REQUESTS_PER_SECOND: ${STACKEXCHANGE_REQUESTS_PER_SECOND:-3}
  STACKEXCHANGE_CONNECT_TIMEOUT_SECONDS: ${STACKEXCHANGE_CONNECT_TIMEOUT_SECONDS:-5}
  STACKEXCHANGE_READ_TIMEOUT_SECONDS: ${STACKEXCHANGE_READ_TIMEOUT_SECONDS:-20}
  STACKEXCHANGE_WRITE_TIMEOUT_SECONDS: ${STACKEXCHANGE_WRITE_TIMEOUT_SECONDS:-10}
  STACKEXCHANGE_POOL_TIMEOUT_SECONDS: ${STACKEXCHANGE_POOL_TIMEOUT_SECONDS:-5}
  STACKEXCHANGE_MAX_RETRIES: ${STACKEXCHANGE_MAX_RETRIES:-4}
  STACKEXCHANGE_QUOTA_RESERVE: ${STACKEXCHANGE_QUOTA_RESERVE:-100}
  STACKEXCHANGE_MAX_RESPONSE_BYTES: ${STACKEXCHANGE_MAX_RESPONSE_BYTES:-8000000}
  STACKEXCHANGE_MAX_PAGES: ${STACKEXCHANGE_MAX_PAGES:-1000}
  STACKEXCHANGE_INCREMENTAL_OVERLAP_SECONDS: ${STACKEXCHANGE_INCREMENTAL_OVERLAP_SECONDS:-86400}
  STACKEXCHANGE_USER_AGENT: ${STACKEXCHANGE_USER_AGENT:-PyAnswer/0.5 StackExchange ingestion worker}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-30}

x-search-environment: &search-environment
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_SERVER_VERSION: ${QDRANT_SERVER_VERSION:-1.18.2}
  QDRANT_CLIENT_VERSION: ${QDRANT_CLIENT_VERSION:-1.18.0}
  QDRANT_ALIAS: ${QDRANT_ALIAS:-pyanswer_chunks_current}
  QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-pyanswer_chunks}
  QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-30}
  QDRANT_MAX_RETRIES: ${QDRANT_MAX_RETRIES:-3}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
  EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
  EMBEDDING_KEEP_ALIVE: ${EMBEDDING_KEEP_ALIVE:-5m}
  EMBEDDING_DOCUMENT_MAX_INPUT_TOKENS: ${EMBEDDING_DOCUMENT_MAX_INPUT_TOKENS:-512}
  SPARSE_PROVIDER: ${SPARSE_PROVIDER:-qdrant_bm25}
  SPARSE_MODEL: ${SPARSE_MODEL:-qdrant/bm25}
  INDEX_SCHEMA_VERSION: ${INDEX_SCHEMA_VERSION:-6.1}
  INDEX_EMBED_BATCH_SIZE: ${INDEX_EMBED_BATCH_SIZE:-16}
  INDEX_QDRANT_UPSERT_BATCH_SIZE: ${INDEX_QDRANT_UPSERT_BATCH_SIZE:-64}
  INDEX_JOB_MAX_ATTEMPTS: ${INDEX_JOB_MAX_ATTEMPTS:-5}
  INDEX_RETAIN_RETIRED_COUNT: ${INDEX_RETAIN_RETIRED_COUNT:-1}
  INDEX_AUTO_CLEANUP: ${INDEX_AUTO_CLEANUP:-false}
  AUTO_ENQUEUE_DOCUMENT_REINDEX: ${AUTO_ENQUEUE_DOCUMENT_REINDEX:-true}
  SEARCH_BM25_CANDIDATES: ${SEARCH_BM25_CANDIDATES:-60}
  SEARCH_VECTOR_CANDIDATES: ${SEARCH_VECTOR_CANDIDATES:-60}
  SEARCH_HYBRID_CANDIDATES: ${SEARCH_HYBRID_CANDIDATES:-80}
  SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
  SEARCH_BM25_WEIGHT: ${SEARCH_BM25_WEIGHT:-1}
  SEARCH_VECTOR_WEIGHT: ${SEARCH_VECTOR_WEIGHT:-1}
  SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-50}
  SEARCH_MAX_CANDIDATES: ${SEARCH_MAX_CANDIDATES:-500}
  RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://reranker:8001}
  RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
  RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-1f54aa72c421b677caa56ece526856f8c60144a5}
  RERANKER_REQUIRED: ${RERANKER_REQUIRED:-false}
  RERANKER_TOP_N: ${RERANKER_TOP_N:-8}
  RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-768}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_TOP_P: ${LLM_TOP_P:-0.9}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
  LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-5m}
  LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-1}
  LLM_QUEUE_LIMIT: ${LLM_QUEUE_LIMIT:-4}
  LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-15}
  LLM_THINK: "false"
  RAG_SEARCH_MODE: ${RAG_SEARCH_MODE:-hybrid}
  RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-80}
  RAG_RERANK_LIMIT: ${RAG_RERANK_LIMIT:-8}
  RAG_SOURCES_LIMIT: ${RAG_SOURCES_LIMIT:-5}
  RAG_MAX_CHUNKS_PER_DOCUMENT: ${RAG_MAX_CHUNKS_PER_DOCUMENT:-2}
  RAG_CONTEXT_TOKEN_BUDGET: ${RAG_CONTEXT_TOKEN_BUDGET:-5000}
  RAG_MIN_RERANKER_SCORE: ${RAG_MIN_RERANKER_SCORE:-0.25}
  RAG_MIN_SOURCE_COUNT: ${RAG_MIN_SOURCE_COUNT:-1}
  RAG_MAX_SOURCE_COUNT: ${RAG_MAX_SOURCE_COUNT:-5}
  RAG_RERANKER_REQUIRED: ${RAG_RERANKER_REQUIRED:-true}

x-backend-image: &backend-image
  image: pyanswer-backend:${APP_VERSION:-0.7.0}
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pyanswer}
      POSTGRES_USER: ${POSTGRES_USER:-pyanswer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:0.32.0
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    environment:
      <<: [*ingestion-environment, *search-environment]
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-PyAnswer API}
      APP_VERSION: ${APP_VERSION:-0.7.0}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pyanswer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyanswer}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-["http://localhost:8080"]}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pyanswer_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-pyanswer_csrf}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      REMEMBER_SESSION_TTL_DAYS: ${REMEMBER_SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Администратор}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend-image
    restart: unless-stopped
    init: true
    stop_grace_period: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-30}s
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *ingestion-environment
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-PyAnswer Worker}
      APP_VERSION: ${APP_VERSION:-0.7.0}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pyanswer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyanswer}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-["http://localhost:8080"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SEED_DEMO_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.worker_health", "--capability", "source_sync"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    logging: *default-logging

  indexer:
    <<: *backend-image
    restart: unless-stopped
    init: true
    stop_grace_period: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-30}s
    command: ["python", "-m", "app.indexer"]
    environment:
      <<: [*ingestion-environment, *search-environment]
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-PyAnswer Indexer}
      APP_VERSION: ${APP_VERSION:-0.7.0}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pyanswer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyanswer}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-["http://localhost:8080"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SEED_DEMO_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.worker_health", "--capability", "search_index"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    logging: *default-logging

  reranker:
    image: pyanswer-reranker:${APP_VERSION:-0.7.0}
    build:
      context: ./backend
      dockerfile: Dockerfile.reranker
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.7.0}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pyanswer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pyanswer}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-["http://localhost:8080"]}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-1f54aa72c421b677caa56ece526856f8c60144a5}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-768}
      RERANKER_TOP_N: ${RERANKER_TOP_N:-8}
      HF_HOME: /models/huggingface
    volumes:
      - reranker_models:/models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  frontend:
    image: pyanswer-frontend:${APP_VERSION:-0.7.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  qdrant_data:
  ollama_models:
  reranker_models:
